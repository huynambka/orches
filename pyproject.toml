[project]
name = "orches"
version = "0.1.0"
description = "Local workspace that runs user-defined omp agent pipelines"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "jsonschema>=4.22,<5"]
[project.scripts]
orches = "orches.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
